    place: North Cascades National Park, WA

  - file: brooks2.jpg
    title: Brooks Range
    place: Brooks Range, AK

  - file: sierra4.jpg
    title: "*Polemonium eximium*"
    place: Sierra Nevada, CA
    note: >-
      For one who climbs to the high passes or ventures out upon granite ledges
      there is a supreme reward, the fragrant cerulean blue flower clusters of
      the Polemonium.
    note_by: Francis Farquhar, *History of the Sierra Nevada*

  - file: cany.jpg
