# The photography page.
#
# To add a photograph:
#   1. Drop the image file into assets/gallery/
#   2. Add an entry below, in the position you want it on the page
#   3. Run ./build.py
#
# Only `file`, `title`, and `place` are required. build.py reads the image's
# dimensions from the file itself, so there is nothing else to look up.
#
#   file     file name inside assets/gallery/
#   title    shown when someone hovers the photograph
#   place    shown under the title
#   note     an optional longer caption, shown on hover and in the full-screen view
#   note_by  who the note is quoting, if anyone

title: Photography
description: >-
  Photos from adventures.

intro: >-
  I take pictures on all my adventures. Here are some of my favourites! You can
  click any one to full-screen it.

photos:
  - file: sierra5.jpg
    title: The Range of Light
    place: Sierra Nevada, CA
    note: >-
      [I]t still seems above all others the range of light, the most divinely 
      beautiful of all the mountain chains I have ever seen.
    note_by: John Muir, *The Mountains of California*

  - file: brooks1.jpg
    title: Noatak River
    place: Brooks Range, AK
    note: >-
      The sheer stupendousness of the wilderness gives it a quality of intangibility
      which is unknown in ordinary manifestations of ocular beauty.
    note_by: Bob Marshall, *The Problem of the Wilderness*

  - file: pefo.jpg
    title: Catching Starlight
    place: Painted Desert, AZ

  - file: wrst.jpeg
    title: Wrangell–St. Elias
    place: Alaska

  - file: pickets.png
